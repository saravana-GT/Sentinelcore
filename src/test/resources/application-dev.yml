# Tests intentionally use an isolated in-memory database so they can run while
# the development server holds the file-backed ./data/sentinelcore database.
spring:
  datasource:
    url: jdbc:h2:mem:sentinelcore-test;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: password
  h2:
    console:
      enabled: false
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
